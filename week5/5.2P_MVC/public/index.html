<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Books Catalog</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 24px; }
      h1 { margin-bottom: 8px; }
      #status { color: #555; margin-bottom: 12px; }
      ul { padding-left: 18px; }
      li { margin: 6px 0; }
      .author { color: #444; }
    </style>
  </head>
  <body>
    <h1>Books</h1>
    <div id="status">Loading…</div>
    <ul id="booksList"></ul>

    <script>
      const statusEl = document.getElementById('status');
      const listEl = document.getElementById('booksList');

      function render(books) {
        listEl.innerHTML = '';
        if (!Array.isArray(books) || books.length === 0) {
          statusEl.textContent = 'No books found.';
          return;
        }

        statusEl.textContent = `Showing ${books.length} books`;
        for (const b of books) {
          const li = document.createElement('li');
          li.innerHTML = `<strong>${b.title}</strong> <span class="author">by ${b.author}</span>`;
          listEl.appendChild(li);
        }
      }

      window.addEventListener('DOMContentLoaded', async () => {
        try {
          const res = await fetch('/api/books');
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const body = await res.json(); // { statusCode, data, message }
          render(body.data);
        } catch (err) {
          console.error(err);
          statusEl.textContent = 'Error loading books.';
        }
      });
    </script>
  </body>
</html>
